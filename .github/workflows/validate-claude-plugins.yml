name: validate-claude-plugins

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Claude plugin validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - plugins/vgv-wingspan
          - plugins/vgv-ai-flutter-plugin
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.278
      - name: Validate ${{ matrix.plugin }}
        working-directory: ${{ matrix.plugin }}
        run: claude plugin validate .

  skill-copies:
    name: Wingspan skill copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Claude vs Cursor skill copies
        run: node scripts/check-skill-copies.mjs
      - name: Unit tests
        run: node --test scripts/check-skill-copies.test.mjs
